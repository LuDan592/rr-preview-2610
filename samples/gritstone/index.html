async function open_(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);

}
async function show(pw){
  const html=await open_(pw);
  try{sessionStorage.setItem("bs-pw",pw)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const b=document.getElementById("go"),er=document.getElementById("err");
  b.disabled=true;b.textContent="…";er.textContent="";
  try{await show(document.getElementById("pw").value)}

});
(async()=>{const h=location.hash.slice(1);let p=null;try{p=sessionStorage.getItem("bs-pw")}catch(e){}

})();
